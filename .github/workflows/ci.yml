name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # matches the Azure VM (node v22)
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Syntax check all source
        run: |
          node --check server.js
          find . -path ./node_modules -prune -o -name '*.js' -print -exec node --check {} +
      # NOTE: a boot-smoke + unit/contract tests are added by the
      # observability-and-ci-baseline spec (they need a Mongo service container).
